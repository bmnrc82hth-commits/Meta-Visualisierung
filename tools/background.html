<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{width:1024px;height:768px;overflow:hidden;
    background:
      radial-gradient(700px 420px at 0% 100%, rgba(255,106,43,.16), transparent 70%),
      radial-gradient(700px 420px at 100% 100%, rgba(47,143,224,.18), transparent 70%),
      linear-gradient(160deg,#16263d 0%,#0d1828 100%);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;position:relative}
  .header{position:absolute;left:0;top:0;width:1024px;height:84px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border-bottom:1px solid rgba(255,255,255,.09)}
  .accent{position:absolute;left:0;top:83px;width:1024px;height:3px;
    background:linear-gradient(90deg,#ff6a2b,#f5b03d 45%,#2f8fe0)}
  .logo{position:absolute;left:20px;top:12px;height:60px;width:200px;
    background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .logo img{max-height:48px;max-width:184px}
</style></head>
<body>
  <div class="header"></div>
  <div class="accent"></div>
  <div class="logo"><img src="LOGO_SRC" alt="MTF"></div>
</body></html>
