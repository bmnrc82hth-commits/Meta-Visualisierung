<script type="text/javascript">
titel ="Startseite";
image = "1.png";
refreshtime = 60;
RefreshLink ="";
taPageVersion = 1;
$('meta[name="viewport"]').replaceWith('<meta name="viewport" content="width=1024">');
// MTF-BETRIEBSART-START
// Sommer/Winter: Eingangsparameter "EIN" wird als "Winter", "AUS" als "Sommer" angezeigt.
// Ändert nur die Anzeige. Unten rechts erscheint "MTF v5", wenn dieses Skript läuft.
var MTF_VERSION = 'MTF v5';
function mtfMode(t){
  t = String(t || '').replace(/[\s ]+/g, ' ').replace(/^\s+|\s+$/g, '').toLowerCase();
  if (/(^|[^a-zäöü])(ein|an|on)([^a-zäöü]|$)/.test(t)) return 'winter';
  if (/(^|[^a-zäöü])(aus|off)([^a-zäöü]|$)/.test(t)) return 'sommer';
  return '';
}
function mtfBetriebsart(){
  try {
    var el = document.getElementById('pos5');
    if (!el) return;
    if (!document.getElementById('mtfjs') && el.parentNode) {
      var tag = document.createElement('div');
      tag.id = 'mtfjs'; tag.appendChild(document.createTextNode(MTF_VERSION));
      el.parentNode.appendChild(tag);
    }
    var label = { winter: 'Winter', sommer: 'Sommer' };
    // Eingabefelder (falls das C.M.I. den Wert so darstellt)
    var inputs = el.getElementsByTagName('input');
    for (var i = 0; i < inputs.length; i++) {
      var mi = mtfMode(inputs[i].value);
      if (mi) { inputs[i].value = label[mi]; el.setAttribute('data-mode', mi); }
    }
    // Textknoten ersetzen, Unterelemente bleiben erhalten
    var nodes = [], stack = [el];
    while (stack.length) {
      var n = stack.pop();
      for (var c = n.firstChild; c; c = c.nextSibling) {
        if (c.nodeType === 3) nodes.push(c);
        else if (c.nodeType === 1 && c.tagName !== 'SCRIPT' && c.tagName !== 'STYLE') stack.push(c);
      }
    }
    for (var k = 0; k < nodes.length; k++) {
      var m = mtfMode(nodes[k].nodeValue);
      if (m) { nodes[k].nodeValue = label[m]; el.setAttribute('data-mode', m); }
    }
  } catch (e) {}
}
if (!window.mtfTimer) { window.mtfTimer = setInterval(mtfBetriebsart, 250); }
mtfBetriebsart();
// MTF-BETRIEBSART-END
</script>
